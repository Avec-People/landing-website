  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var( ; min-height:380px; border-left:1px solid rgba(147,162,194,0.18); background:radial-gradient(90% 80% at 50% 45%, #0A142E 0%, #050B1A 70%);\">\n            <canvas ref=\"{{ wc0 }}\" style=\"position:absolute; inset:0; width:100%; height:100%; display:block;\"><\u002Fcanvas>\n            <div style=\"position:absolute; left:18px; bottom:16px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; letter-spacing:0.18em; color:#5C6B8C; text-transform:uppercase;\">Fig. 01 — knowledge mesh<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article data-reveal=\"1\" style=\"flex:0 0 auto; width:min(1120px,86vw); border:1px solid rgba(147,162,194,0.18); background:#070F22; display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr));\">\n          <div style=\"padding:clamp(24px,3vw,40px); display:flex; flex-direction:column; gap:22px;\">\n            <div style=\"display:flex; justify-content:space-between; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase;\"><span style=\"color:#7C5CFF;\">02<\u002Fspan><span style=\"color:#5C6B8C;\">Real-time ML · Banking<\u002Fspan><\u002Fdiv>\n            <h3 style=\"margin:0; font-size:clamp(1.6rem,2.6vw,2.4rem); line-height:1.02; letter-spacing:-0.02em; font-weight:600;\">Fraud Detection Engine<\u002Fh3>\n            <div>\n              <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; letter-spacing:0.2em; color:#5C6B8C; text-transform:uppercase; margin-bottom:8px;\">Problem<\u002Fdiv>\n              <p style=\"margin:0; font-size:0.95rem; line-height:1.6; color:#B7C2DA;\">Fraud decisions in transaction is a tedious manual labor needing a full team of full time workers to do.<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; letter-spacing:0.2em; color:#5C6B8C; text-transform:uppercase; margin-bottom:8px;\">Approach<\u002Fdiv>\n              <p style=\"margin:0; font-size:0.95rem; line-height:1.6; color:#B7C2DA;\">An ensemble AI solution that flags fraudulent transactions significantly raising accuracy and reducing human labor needed.<\u002Fp>\n            <\u002Fdiv><\u002Fdiv>\n          <div style=\"position:relative; min-height:380px; border-left:1px solid rgba(147,162,194,0.18); background:radial-gradient(90% 80% at 50% 45%, #0A142E 0%, #050B1A 70%);\">\n            <canvas ref=\"{{ wc1 }}\" style=\"position:absolute; inset:0; width:100%; height:100%; display:block;\"><\u002Fcanvas>\n            <div style=\"position:absolute; left:18px; bottom:16px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; letter-spacing:0.18em; color:#5C6B8C; text-transform:uppercase;\">Fig. 02 — anomaly graph<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article data-reveal=\"1\" style=\"flex:0 0 auto; width:min(1120px,86vw); border:1px solid rgba(147,162,194,0.18); background:#070F22; display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr));\">\n          <div style=\"padding:clamp(24px,3vw,40px); display:flex; flex-direction:column; gap:22px;\">\n            <div style=\"display:flex; justify-content:space-between; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase;\"><span style=\"color:#FFB020;\">03<\u002Fspan><span style=\"color:#5C6B8C;\">AI · Procurement<\u002Fspan><\u002Fdiv>\n            <h3 style=\"margin:0; font-size:clamp(1.6rem,2.6vw,2.4rem); line-height:1.02; letter-spacing:-0.02em; font-weight:600;\">Automated Procurement Auditing<\u002Fh3>\n            <div>\n              <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; letter-spacing:0.2em; color:#5C6B8C; text-transform:uppercase; margin-bottom:8px;\">Problem<\u002Fdiv>\n              <p style=\"margin:0; font-size:0.95rem; line-height:1.6; color:#B7  font-weight:600; max-width:22ch;\">How we build, without exception.<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); border-top:2px solid rgba(147,162,194,0.28);\">\n        <div data-reveal=\"1\" style=\"padding:32px 28px 40px 0; border-bottom:1px solid rgba(147,162,194,0.16);\">\n          <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.2em; color:#22D3EE; margin-bottom:20px;\">01 / PRODUCTION FIRST<\u002Fdiv>\n          <p style=\"margin:0; font-size:1rem; line-height:1.6; color:#B7C2DA;\">We ship into live traffic — on-premise or in-region, under audit. Demos are not deliverables.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"padding:32px 28px 40px; border-bottom:1px solid rgba(147,162,194,0.16); border-left:1px solid rgba(147,162,194,0.16);\">\n          <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.2em; color:#22D3EE; margin-bottom:20px;\">02 / CONSTRAINED MODELS<\u002Fdiv>\n          <p style=\"margin:0; font-size:1rem; line-height:1.6; color:#B7C2DA;\">Every model output is grounded, cited and bounded. If it cannot be verified, it does not reach a user.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"padding:32px 28px 40px; border-bottom:1px solid rgba(147,162,194,0.16); border-left:1px solid rgba(147,162,194,0.16);\">\n          <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.2em; color:#22D3EE; margin-bottom:20px;\">03 / DATA RESIDENCY<\u002Fdiv>\n          <p style=\"margin:0; font-size:1rem; line-height:1.6; color:#B7C2DA;\">Regional regulation is a first-commit constraint: in-country data, documented lineage, reviewable access.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"padding:32px 0 40px 28px; border-bottom:1px solid rgba(147,162,194,0.16); border-left:1px solid rgba(147,162 ono',ui-monospace,monospace; font-size:13px; line-height:1.6; resize:vertical; cursor:none;\" style-focus=\"border-color:#22D3EE; outline:none\"><\u002Ftextarea>\n          <\u002Flabel>\n          <button type=\"submit\" data-send=\"1\" data-magnetic=\"1\" data-cursor=\"cta\" style=\"display:flex; align-items:center; justify-content:space-between; gap:40px; width:100%; max-width:340px; background:#22D3EE; color:#04121A; border:1px solid #22D3EE; padding:18px 20px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; cursor:none;\" style-hover=\"background:#5AE3F5; border-color:#5AE3F5\">Send brief<span>→<\u002Fspan><\u002Fbutton>\n        <\u002Fform>\n        <div style=\"display:flex; flex-direction:column; gap:28px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px; letter-spacing:0.1em; color:#93A2C2;\">\n          <div style=\"border-top:1px solid rgba(147,162,194,0.16); padding-top:18px;\">\n            <div style=\"font-size:10px; letter-spacing:0.2em; color:#5C6B8C; text-transform:uppercase; margin-bottom:10px;\">Direct<\u002Fdiv>\n            <a href=\"mailto:contact@multiversemena.com\" data-cursor=\"link\" style=\"color:#E9EDF7; cursor:none;\" style-hover=\"color:#22D3EE\">contact@multiversemena.com<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid rgba(147,162,194,0.16); padding-top:18px;\">\n            <div style=\"font-size:10px; letter-spacing:0.2em; color:#5C6B8C; text-transform:uppercase; margin-bottom:10px;\">Offices<\u002Fdiv>\n            <div style=\"color:#E9EDF7; line-height:1.9;\">Egypt — Cairo<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid rgba(147,162,194,0.16); padding-top:18px;\">\n            <div style=\"font-size:10px; letter-spacing:0.2em; color:#5C6B8C; text-transform:uppercase; margin-bottom:10px;\">Engagements<\u002Fdiv>\n            <div style=\"color:#B7C2DA; line-height:1.9; font-size:11px;\">Build &amp; operate · Systems audit<br>Embedded engineering teams<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <div ref=\"{{ modal }}\" role=\"dialog\" aria-modal=\"true\" aria-label=\"All projects\" style=\"display:none; position:fixed; inset:0; z-index:70; background:rgba(4,9,20,0.88); align-items:flex-start; justify-content:center; overflow-y:auto; padding:clamp(16px,5vh,64px) clamp(12px,4vw,48px);\">\n    <div ref=\"{{ modalPanel }}\" style=\"width:100%; max-width:1060px; background:#070F22; border:1px solid rgba(147,162,194,0.24); padding:clamp(24px,4vw,48px);\">\n      <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:24px; padding-bottom:clamp(20px,3vh,32px); border-bottom:2px solid rgba(147,162,194,0.28);\">\n        <div>\n          <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.2em; color:#22D3EE; text-transform:uppercase; margin-bottom:12px;\">Index — all projects<\u002Fdiv>\n          <h2 style=\"margin:0; font-size:clamp(1.6rem,3.4vw,2.6rem); line-height:1; letter-spacing:-0.02em; font-weight:600;\">Five systems, in production.<\u002Fh2>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ closeAll }}\" data-cursor=\"cta\" aria-label=\"Close\" style=\"flex:0 0 auto; background:transparent; border:1px solid rgba(147,162,194,0.28); color:#E9EDF7; width:44px; height:44px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:16px; line-height:1; cursor:none;\" style-hover=\"border-color:#22D3EE; color:#22D3EE\">×<\u002Fbutton>\n      <\u002Fdiv>\n          <article style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:clamp(16px,3vw,44px); padding:clamp(22px,3vh,32px) 0; border-top:1px solid rgba(147,162,194,0.16);\">\n            <div>\n              <div style=\"display:flex; gap:14px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:14px;\"><span style=\"color:#22D3EE;\">01<\u002Fspan><span style=\"color:#5C6B8C;\">AI · Public sector<\u002Fspan><\u002Fdiv>\n              <h3 style=\"margin:0; font-size:clamp(1.3rem,2vw,1.75rem); line-height:1.05; letter-spacing:-0.02em; font-weight:600;\">AI Judicial Assistant<\u002Fh3>\n            <\u002Fdiv>\n            <p style=\"margin:0; font-size:0.95rem; line-height:1.65; color:#B7C2DA; max-width:62ch;\">An LLM research and case-analysis assistant for court systems, grounded in local law and issuing cited analysis, with automated audit workflows for UAE public-sector clients.<\u002Fp>\n          <\u002Farticle>\n          <article style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:clamp(16px,3vw,44px); padding:clamp(22px,3vh,32px) 0; border-top:1px solid rgba(147,162,194,0.16);\">\n            <div>\n              <div style=\"display:flex; gap:14px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:14px;\"><span style=\"color:#7C5CFF;\">02<\u002Fspan><span style=\"color:#5C6B8C;\">Real-time ML · Banking<\u002Fspan><\u002Fdiv>\n              <h3 style=\"margin:0; font-size:clamp(1.3rem,2vw,1.75rem); line-height:1.05; letter-spacing:-0.02em; font-weight:600;\">Fraud Detection Engine<\u002Fh3>\n            <\u002Fdiv>\n            <p style=\"margin:0; font-size:0.95rem; line-height:1.65; color:#B7C2DA; max-width:62ch;\">Ensemble anomaly detection over live transaction streams. Every payment is scored in-flight, and each block carries an explanation an analyst can act on.<\u002Fp>\n          <\u002Farticle>\n          <article style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:clamp(16px,3vw,44px); padding:clamp(22px,3vh,32px) 0; border-top:1px solid rgba(147,162,194,0.16);\">\n            <div>\n              <div style=\"display:flex; gap:14px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:14px;\"><span style=\"color:#22D3EE;\">03<\u002Fspan><span style=\"color:#5C6B8C;\">AI · Procurement<\u002Fspan><\u002Fdiv>\n              <h3 style=\"margin:0; font-size:clamp(1.3rem,2vw,1.75rem); line-height:1.05; letter-spacing:-0.02em; font-weight:600;\">Automated Procurement Auditing<\u002Fh3>\n            <\u002Fdiv>\n            <p style=\"margin:0; font-size:0.95rem; line-height:1.65; color:#B7C2DA; max-width:62ch;\">Every contract, invoice and vendor record is parsed on submission, checked against policy and prior awards, and flagged with a cited exception trail an auditor can sign off.<\u002Fp>\n          <\u002Farticle>\n          <article style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:clamp(16px,3vw,44px); padding:clamp(22px,3vh,32px) 0; border-top:1px solid rgba(147,162,194,0.16);\">\n            <div>\n              <div style=\"display:flex; gap:14px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:14px;\"><span style=\"color:#7C5CFF;\">04<\u002Fspan><span style=\"color:#5C6B8C;\">Education platform · Denmark<\u002Fspan><\u002Fdiv>\n              <h3 style=\"margin:0; font-size:clamp(1.3rem,2vw,1.75rem); line-height:1.05; letter-spacing:-0.02em; font-weight:600;\">KHRS Academy<\u002Fh3>\n            <\u002Fdiv>\n            <p style=\"margin:0; font-size:0.95rem; line-height:1.65; color:#B7C2DA; max-width:62ch;\">A course and enrolment platform for a Danish vocational academy delivering AMU-certified training in commercial cleaning and hotel service, built around bilingual learners and paired with the E-asylearn digital learning app.<\u002Fp>\n          <\u002Farticle>\n          <article style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:clamp(16px,3vw,44px); padding:clamp(22px,3vh,32px) 0; border-top:1px solid rgba(147,162,194,0.16);\">\n            <div>\n              <div style=\"display:flex; gap:14px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:14px;\"><span style=\"color:#FFB020;\">05<\u002Fspan><span style=\"color:#5C6B8C;\">Logistics · Egypt<\u002Fspan><\u002Fdiv>\n              <h3 style=\"margin:0; font-size:clamp(1.3rem,2vw,1.75rem); line-height:1.05; letter-spacing:-0.02em; font-weight:600;\">Elmisria Cargo<\u002Fh3>\n            <\u002Fdiv>\n            <p style=\"margin:0; font-size:0.95rem; line-height:1.65; color:#B7C2DA; max-width:62ch;\">Freight and customs operations for an air and ocean cargo operator at Cairo Airport — shipment handling across air freight, ocean freight, inland transport, customs clearance and express cargo, including GSSA services for airlines.<\u002Fp>\n          <\u002Farticle>\n      <div style=\"border-top:1px solid rgba(147,162,194,0.16); padding-top:clamp(20px,3vh,28px); display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:center;\">\n        <span style=\"font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; letter-spacing:0.18em; color:#5C6B8C; text-transform:uppercase;\">Details available under NDA<\u002Fspan>\n        <a href=\"#contact\" sc-camel-on-click=\"{{ closeAll }}\" data-magnetic=\"1\" data-cursor=\"cta\" style=\"display:flex; align-items:center; justify-content:space-between; gap:32px; min-width:240px; background:#22D3EE; color:#04121A; padding:16px 18px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; cursor:none;\" style-hover=\"background:#5AE3F5\">Start a brief<span>→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <footer style=\"position:relative; z-index:3; border-top:1px solid rgba(147,162,194,0.16); background:#040914;\">\n    <div style=\"width:100%; max-width:1440px; margin:0 auto; padding:26px clamp(20px,4vw,64px); display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; letter-spacing:0.18em; color:#5C6B8C; text-transform:uppercase;\">\n      <span style=\"display:flex; align-items:center; gap:10px;\"><span style=\"width:6px; height:6px; background:#22D3EE; display:block; animation:mv-blink 2.6s ease-in-out infinite;\"><\u002Fspan>MultiVerse MENA — software house<\u002Fspan>\n      <span>AI · Software · Enterprise platforms<\u002Fspan>\n      <span>© 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#22D3EE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#22D3EE&quot;,&quot;#7C5CFF&quot;,&quot;#FFB020&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;particleDensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.3,&quot;max&quot;:1.8,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;showGridLines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;customCursor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Interaction&quot;}}\">\nconst CY = '#22D3EE', VI = '#7C5CFF', AM = '#FFB020';\nconst EASE = 'cubic-bezier(0.16,1,0.3,1)';\n\nclass Component extends DCLogic {\n  root = React.createRef(); heroCanvas = React.createRef(); ring = React.createRef(); dot = React.createRef();\n  grid = React.createRef(); pin = React.createRef(); track = React.createRef(); workSec = React.createRef();\n  bar = React.createRef(); wipe1 = React.createRef(); wipe2 = React.createRef(); hdr = React.createRef();\n  modal = React.createRef(); modalPanel = React.createRef();\n  wc = [React.createRef(), React.createRef(), React.createRef()];\n  scenes = []; ios = []; pinRange = 0;\n  mouse = { x: 0, y: 0 }; mouseL = { x: 0, y: 0 };\n  cur = { x: -200, y: -200 }; curL = { x: -200, y: -200 }; ringScale = 1; ringTarget = 1;\n\n  accent() { return this.props.accentColor || CY; }\n  density() { const d = this.props.particleDensity; return typeof d === 'number' ? d : 1; }\n\n  renderVals() {\n    return {\n      root: this.root, heroCanvas: this.heroCanvas, ring: this.ring, dot: this.dot, grid: this.grid,\n      pin: this.pin, track: this.track, workSec: this.workSec, bar: this.bar, hdr: this.hdr,\n      wipe1: this.wipe1, wipe2: this.wipe2,\n      wc0: this.wc[0], wc1: this.wc[1], wc2: this.wc[2],\n      modal: this.modal, modalPanel: this.modalPanel,\n      onSubmit: this.onSubmit, openAll: this.openAll, closeAll: this.closeAll\n    };\n  }\n\n  openAll = (e) => {\n    if (e) e.preventDefault();\n    const m = this.modal.current;\n    if (!m) return;\n    m.style.display = 'flex';\n    document.body.style.overflow = 'hidden';\n    const btn = m.querySelector('button');\n    if (btn) btn.focus();\n  };\n\n  closeAll = () => {\n    const m = this.modal.current;\n    if (!m) return;\n    m.style.display = 'none';\n    document.body.style.overflow = '';\n  };\n\n  onKey = (e) => { if (e.key === 'Escape') this.closeAll(); };\n\n  onModalClick = (e) => { if (e.target === this.modal.current) this.closeAll(); };\n\n  onSubmit = (e) => {\n    e.preventDefault();\n    const b = e.currentTarget.querySelector('[data-send]');\n    if (b) { b.firstChild.textContent = 'Brief received'; b.style.background = 'transparent'; b.style.color = this.accent(); }\n  };\n\n  componentDidMount() {\n    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.mobile = window.innerWidth < 900;\n    this.ap  * 0.22, (i - j) * 0.28);\n      const cv = new T.QuadraticBezierCurve3(left[i], ctrl, right[j]);\n      const pts = cv.getPoints(samples);\n      arcs.push(pts);\n      group.add(new T.Line(new T.BufferGeometry().setFromPoints(pts), lineMat));\n    }\n    const count = this.mobile ? 140 : 340;\n    const pPos = new Float32Array(count * 3), pCol = new Float32Array(count * 3);\n    const state = [];\n    const cA = new T.Color(this.accent()), cB = new T.Color(VI);\n    for (let i = 0; i < count; i++) {\n      state.push({ a: Math.floor(Math.random() * arcs.length), t: Math.random(), v: 0.09 + Math.random() * 0.14 });\n      const c = Math.random() < 0.82 ? cA : cB;\n      pCol[i * 3] = c.r; pCol[i * 3 + 1] = c.g; pCol[i * 3 + 2] = c.b;\n    }\n    const pg = new T.BufferGeometry();\n    pg.setAttribute('position', new T.BufferAttribute(pPos, 3));\n    pg.setAttribute('color', new T.BufferAttribute(pCol, 3));\n    const pm = new T.PointsMaterial({ size: 0.06, vertexColors: true, transparent: true, opacity: 0.95, blending: T.AdditiveBlending, depthWrite: false });\n    group.add(new T.Points(pg, pm));\n    let last = 0;\n    return {\n      scene, camera, update: (time) => {\n        const dt = Math.min(0.05, last ? time - last : 0.016); last = time;\n        for (let i = 0; i < count; i++) {\n          const s = state[i];\n          s.t += s.v * dt;\n          if (s.t > 1) { s.t = 0; s.a = Math.floor(Math.random() * arcs.length); }\n          const arc = arcs[s.a];\n          const f = s.t * samples, k = Math.min(samples - 1, Math.floor(f)), m = f - k;\n          const a = arc[k], b = arc[k + 1] || arc[k];\n          pPos[i * 3] = a.x + (b.x - a.x) * m;\n          pPos[i * 3 + 1] = a.y + (b.y - a.y) * m;\n          pPos[i * 3 + 2] = a.z + (b.z - a.z) * m;\n        }\n        pg.attributes.position.needsUpdate = true;\n        group.rotation.y = Math.sin(time * 0.16) * 0.35;\n        group.rotation.x = Math.sin(time * 0.11) * 0.12;\n      }\n    };\n  }\n\n  wipeScene() {\n    const T = this.T;\n    const scene = new T.Scene();\n    const camera = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);\n    const uniforms = {\n      uP: { value: 0 }, uTime: { value: 0 },\n      uAccent: { value: new T.Color(this.accent()) },\n      uAspect: { value: 4.0 }\n    };\n    const mat = new T.ShaderMaterial({\n      uniforms,\n      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',\n      fragmentShader: `\n        precision mediump float;\n        uniform float uP; uniform float uTime; uniform vec3 uAccent; uniform float uAspect;\n        varying vec2 vUv;\n        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }\n        float noise(vec2 p){\n          vec2 i = floor(p), f = fract(p);\n          vec2 u = f * f * (3.0 - 2.0 * f);\n          return mix(mix(hash(i), hash(i + vec2(1.0,0.0)), u.x), mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);\n        }\n        void main(){\n          vec2 uv = vUv;\n          float n = noise(vec2(uv.x * 5.0, uv.y * 2.2) + uTime * 0.05);\n          float edge = uv.x * 0.72 + n * 0.28;\n          float m = smoothstep(uP - 0.09, uP + 0.09, edge);\n          vec3 dark = vec3(0.016, 0.035, 0.078);\n          vec3 lit = vec3(0.039, 0.078, 0.176);\n          vec3 col = mix(lit, dark, m);\n          float band = smoothstep(0.055, 0.0, abs(edge - uP));\n          col += uAccent * band * 0.85;\n          float rule = smoothstep(0.004, 0.0, abs(uv.y - 0.5)) * (1.0 - m) * 0.5;\n          col += uAccent * rule * 0.35;\n          float scan = 0.035 * sin(uv.y * 220.0);\n          col += scan * (1.0 - m);\n          gl_FragColor = vec4(col, 1.0);\n        }`\n    });\n    const quad = new T.Mesh(new T.PlaneGeometry(2, 2), mat);\n    scene.add(quad);\n    const entry = {\n      scene, camera,\n      onResize: (w, h) => { uniforms.uAspect.value = w / Math.max(1, h); },\n      update: (time) => { uniforms.uTime.value = time; },\n      progress: () => {\n        const c = entry.canvas;\n        if (!c) return;\n        const r = c.getBoundingClientRect();\n        const p = (window.innerHeight - r.top) / (window.innerHeight + r.height);\n        uniforms.uP.value = Math.min(1, Math.max(0, p));\n      }\n    };\n    return entry;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
